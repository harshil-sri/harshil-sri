<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Activity">
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .title { font: 600 15px 'Segoe UI', Ubuntu, sans-serif; fill: #0969da; }
  .label { font: 400 13px 'Segoe UI', Ubuntu, sans-serif; fill: #57606a; }
  .value { font: 600 13px 'Segoe UI', Ubuntu, sans-serif; fill: #1f2328; }
  .track { fill: #eaeef2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .title { fill: #58a6ff; }
    .label { fill: #8b949e; }
    .value { fill: #e6edf3; }
    .track { fill: #21262d; }
  }
  .row { opacity: 0; animation: fade 0.5s ease-out forwards; }
  .bar { transform-box: fill-box; transform: scaleX(0); animation: grow 0.9s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
<rect class="bg" x="0.5" y="0.5" rx="8" width="419" height="199"/><text class="title" x="22" y="34">Activity</text><g class="row" style="animation-delay:0.10s"><text class="label" x="22" y="64">Contributions in the last year</text><text class="value" x="398" y="64" text-anchor="end">1,174</text></g><g class="row" style="animation-delay:0.22s"><text class="label" x="22" y="86">Commits (public)</text><text class="value" x="398" y="86" text-anchor="end">1,118</text></g><g class="row" style="animation-delay:0.34s"><text class="label" x="22" y="108">Pull requests</text><text class="value" x="398" y="108" text-anchor="end">16</text></g><g class="row" style="animation-delay:0.46s"><text class="label" x="22" y="130">Public repos</text><text class="value" x="398" y="130" text-anchor="end">20</text></g><g class="row" style="animation-delay:0.58s"><text class="label" x="22" y="152">Stars earned</text><text class="value" x="398" y="152" text-anchor="end">20</text></g></svg>