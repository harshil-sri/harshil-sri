name: Build README

on:
  schedule:
    - cron: "17 */3 * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths: [templates/**, scripts/**, .github/workflows/build-readme.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build README and stats
        run: python scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "Harshil"
          git config user.email "178780414+harshil-sri@users.noreply.github.com"
          git add README.md generated
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh profile README with latest activity"
            git pull --rebase origin main
            git push
          fi
